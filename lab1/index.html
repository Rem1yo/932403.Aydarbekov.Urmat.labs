<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>О себе — Урмат Айдарбеков</title>
</head>
<body>
  <header>
    <img src="images/avatar.svg" alt="Аватар Урмата Айдарбекова" width="120" height="120">
    <div>
      <h1>О себе</h1>
      <p>Урмат Айдарбеков, путешественник</p>
    </div>
  </header>

  <main>
    <h2>Обратная связь</h2>
    <form action="#" method="post">
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" placeholder="Ваше имя">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@mail.ru">

      <label for="message">Сообщение</label>
      <textarea id="message" name="message" rows="5" placeholder="Напишите сообщение"></textarea>

      <button type="submit">Отправить</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Урмат Айдарбеков</p>
  </footer>
</body>
</html>
